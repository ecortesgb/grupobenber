<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>GB Saurio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
  <!-- Panel de chat (visible solo en modo grande) -->
  <section id="panel" hidden>
    <header>
      <img class="cara" src="sprites/cuadros/saluda.webp" alt="">
      <div class="nombre"><b>GB Saurio</b><small>Tu asistente Benber</small></div>
      <nav>
        <button class="tab activa" data-tab="chat">Chat</button>
        <button class="tab" data-tab="pend">Pendientes <span id="nPend"></span></button>
      </nav>
      <button id="voz" title="Contestar también hablando" aria-pressed="false">🔇</button>
      <button id="cerrar" title="Minimizar">–</button>
    </header>

    <div id="vistaChat" class="vista">
      <div id="mensajes"></div>
      <div id="planCaja" hidden>
        <div id="planTexto"></div>
        <div class="fila">
          <button id="aplicar" class="primario">Aplicar</button>
          <button id="descartar">Descartar</button>
        </div>
      </div>
      <div class="atajos">
        <button data-pregunta="Analiza mi escritorio y propón cómo organizarlo.">🗂️ Escritorio</button>
        <button data-pregunta="Analiza mi carpeta de descargas y dime qué puedo limpiar u ordenar.">⬇️ Descargas</button>
        <button data-pregunta="¿Qué pendientes tengo y cuál me recomiendas atacar primero?">✅ Mi día</button>
        <button id="btnReunion">🎙️ Reunión</button>
        <button id="btnDeshacer" title="Regresa los archivos del último plan aplicado">↩️ Deshacer</button>
      </div>
      <form id="forma">
        <textarea id="entrada" rows="2" placeholder="Escríbele o presiona 🎤 y háblale… (Enter envía)"></textarea>
        <button type="button" id="mic" title="Háblale (Ctrl+Espacio). Se detiene solo cuando te callas.">🎤</button>
        <button class="primario">➤</button>
      </form>
    </div>

    <div id="vistaPend" class="vista" hidden>
      <ul id="listaPend"></ul>
      <div class="fila"><button id="excel" class="primario">Exportar a Excel</button></div>
    </div>
  </section>

  <!-- Mascota -->
  <div id="globo" hidden></div>
  <div id="mascota"></div>
  <button id="hablale" title="Háblale a Saurio (se detiene solo cuando te callas)" aria-label="Háblale a Saurio">🎤</button>
  <button id="minimizar" title="Minimizar (queda una carita)" aria-label="Minimizar a GB Saurio">–</button>
  <button id="mini" hidden title="Abrir a GB Saurio" aria-label="Abrir a GB Saurio"></button>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="mascota.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
